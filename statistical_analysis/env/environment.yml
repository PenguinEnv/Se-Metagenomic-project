# conda / mamba environment (versions actually used for the analysis)
#   micromamba create -f env/environment.yml
#   micromamba run -n se-bes-stats Rscript scripts/se_bes_metagenome_stats.R
name: se-bes-stats
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base=4.4.3
  - r-vegan=2.7.5
  - r-permute=0.9.10
  - r-ggplot2=4.0.3
  - r-ggrepel=0.9.8
  - r-patchwork=1.3.2
  - bioconductor-aldex2=1.38.0
